name: Publicar GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Produção em GitHub Pages NÃO tem proxy /ords.
      # Defina o secret VITE_ORDS_BASE_URL como a URL do Worker Cloudflare
      # (ex.: https://pope-ords-proxy.<conta>.workers.dev/ords), NÃO a URL crua do ADB
      # (ADB rejeita Origin → ORDS-13002). Ver README / cloudflare/.
      - name: Gerar o site estático
        env:
          VITE_ORDS_BASE_URL: ${{ secrets.VITE_ORDS_BASE_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          if [ -z "$VITE_ORDS_BASE_URL" ]; then
            echo "::warning::Secret VITE_ORDS_BASE_URL vazio — vitrine usará fallback local."
          else
            echo "VITE_ORDS_BASE_URL definido (comprimento ${#VITE_ORDS_BASE_URL})."
          fi
          npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
